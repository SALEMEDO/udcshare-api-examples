      <stop offset="0%" stop-color="#17110F"/>
      <stop offset="55%" stop-color="#221A17"/>
      <stop offset="100%" stop-color="#2E2420"/>
    </linearGradient>
    <linearGradient id="trait" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF3366" stop-opacity="0"/>
      <stop offset="45%" stop-color="#FF3366"/>
      <stop offset="100%" stop-color="#FF3366" stop-opacity="0"/>
